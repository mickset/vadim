<main>

  <!-- HERO — rebuilt from Figma frame "1920 new" (Page 2, node 1129:1121).
       Single static photo (hero-photo.webp, native 2198x1200 — the exact
       "image 33" asset), no animation on it at all. Only the headline block
       animates (soft fade + rise). Sized/positioned with vw units derived
       from the 1920px reference frame (left:-14.32vw top:0 width:114.48vw
       height:62.5vw) so it scales without distortion at any viewport width;
       .hero's own height is locked to 62.5vw (matches the photo's aspect
       ratio exactly), so everything positioned inside it via % stays
       proportional too. -->
  <section class="hero" id="hero">
    <img class="hero-photo" src="hero-photo.webp" alt="ЖК «Жемчужина Керчи» — вид на дом и Крымский мост">

    <div class="hero-headline-wrap">
      <h1 class="hero-headline"><span class="line-1">Жемчужина</span><span class="line-2">Керчи</span></h1>
      <p class="hero-caption">Ваш идеальный дом у Чёрного моря</p>
    </div>
  </section>

</main>

<!-- Fixed CTA bar — stays in the same spot on screen regardless of scroll,
     per spec ("должны быть всегда в одном и том же месте даже при скролле").
     Lives outside <main> as a direct <body> child so `position: fixed` is
     always relative to the viewport. -->
<div class="fixed-cta-bar">
  <div class="hero-ctas">
    <button class="btn-pill-green" id="ctaHeroBtn" type="button">Выбрать квартиру</button>
    <button class="btn-pill-glass" id="ctaSpecsBtn" type="button">Характеристики дома</button>
  </div>
  <a class="phone-fab" href="tel:+79780520008" aria-label="Позвонить">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">

    </svg>
  </a>
</div>
